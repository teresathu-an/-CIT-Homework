<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[CIT] BTVN4 - Thu An</title>
    <style>
    .nut
    {   
    color: white;
    border-radius: 5px; 
    background-color:rgb(75, 137, 213); 
    width:700px; height:30px;
    }
    .vien{border-radius:4px}
    </style>
</head>
<body>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <form action="/action_page.php" method="post" target="_blank" style="width:700px; height:670px;">
    <fieldset class="vien">
        <h1><center>Đơn ứng tuyển: Lập trình viên Front-End</center></h1>
        <fieldset class="vien">
            <legend><h3>Thông tin cá nhân</h3></legend>
            <label for="hoten"><b>Họ và tên:</b></label><br>
            <input type="text" id="hoten" name="hoten" required><br><br>
            <label for="sdt"><b>Số điện thoại:</b></label><br>
            <input type="text" id="sdt" name="sdt" required><br><br>
            <label for="email"><b>Email:</b></label><br>
            <input type="text" id="email" name="email" required><br><br>
        </fieldset>
        <fieldset class="vien">
            <legend><h3>Thông tin ứng tuyển</h3></legend>
            <label for="thuxinviec"><b>Thư xin việc:</b></label><br>
            <textarea name="thuxinviec" rows="10" cols="60" placeholder="Tại sao bạn lại phù hợp với vị trí này?" requied></textarea><br><br>
            <label for="CV"><b>Tải lên sơ yếu lý lịch/CV</b></label><br>
            <input type="file" id="file" style="background-color:gray; color:white">
        </fieldset> 
    </fieldset>
    <input type="submit" value="Gửi đơn ứng tuyển" class="nut">
    </form> 
</body>
</html>
