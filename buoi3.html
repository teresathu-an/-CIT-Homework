<body>
     <fieldset>
        <legend>Thông tin cá nhân</legend>
    <form action="/action_page.php" method="post" target="_blank">

        <input type="text" id="hovaten" name="hovaten" value="Trần Thu An" readonly><br><br>

        <input type="text" id="sdt" name="sdt" required><br><br>
        <label for="lop">Lớp hành chính:</label>
        <select id="lop" name="lop" required>
            <option value="K62S1">K62S1</option>
            <option value="K62S2" selected>K62S2</option>
            <option value="K62S3">K62S3</option>
            <option value="K62S4">K62S4</option>
            <option value="K62SSI1">K62SSI1</option>
            <option value="K62SSI2">K62SSI2</option>
            <option value="K62AI1">K62AI1</option>
            <option value="K62K62AI2">K62AI2</option>
        </select><br><br>
        <label for="tenkhoavien">Khoa/Viện:</label>
        <input list="tenkhoavien" name="tenkhoavien">
        <datalist id="tenkhoavien">
            <option value="Khoa Công nghệ số ứng dụng"></option>
            <option value="Khoa Thương mại điện tử"></option>
            <option value="Viện Quản trị kinh doanh"></option>   
        </datalist><br><br>
        <label for="sothich">Sở thích</label>

        <label for="tinhcach">Tính cách</label>
        <textarea name="tinhcach" id="tinhcach" width="40" height="50"></textarea>
        <input type="submit" value="Gửi">
        <button type="button" onclick="alert('Cảm ơn bạn đã tham gia')">Lưu thông tin</button>
        <button type="reset">Xóa tất cả</button>
    </form>
    </fieldset>

</html>
